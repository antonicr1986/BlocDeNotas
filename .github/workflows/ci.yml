name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'screenshots/**'
  # Permite lanzar el pipeline a mano desde la pestana Actions
  workflow_dispatch:

jobs:
  # Busca credenciales en TODO el historial, no solo en el ultimo commit.
  # Corre en Linux aunque el build sea en Windows: es mas rapido y arranca
  # antes, y no depende del build (una fuga importa aunque el codigo compile).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks necesita el historial completo

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # --redact es importante: sin el, el secreto encontrado acabaria escrito
      # en los logs de la ejecucion, que en un repo publico ve cualquiera
      - name: Scan for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --verbose

  build:
    # WinForms sobre .NET Framework solo compila en Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Pone MSBuild en el PATH. .NET Framework no usa "dotnet build"
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      # Descarga los paquetes de packages.config, que ya no estan en el repo
      - name: Restore NuGet packages
        run: nuget restore BlocNotasWF.sln

      - name: Build
        run: msbuild BlocNotasWF.sln /p:Configuration=Release /verbosity:minimal

      # Deja el ejecutable descargable desde la pagina de la ejecucion
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: BlocNotasWF-${{ github.sha }}
          path: BlocNotasWF/bin/Release/
          if-no-files-found: error
